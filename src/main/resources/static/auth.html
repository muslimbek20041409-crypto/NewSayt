<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                    radial-gradient(circle at top left, rgba(59,130,246,0.25), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(34,197,94,0.18), transparent 24%),
                    linear-gradient(135deg, #0f172a, #1d4ed8, #0f766e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.16);
            backdrop-filter: blur(14px);
            padding: 30px 26px;
            border-radius: 24px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.28);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(191,219,254,0.45);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #1d4ed8;
            transition: 0.2s;
        }

        button:hover {
            background: #dbeafe;
        }

        .message {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }

        .success { color: #86efac; }
        .error { color: #fecaca; }
        .info { color: #bfdbfe; }

        /* 🔥 SIGN IN LINK */
        .signin-box {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #dbeafe;
        }

        .signin-box span {
            opacity: 0.9;
        }

        .signin-box a {
            margin-left: 6px;
            color: white;
            font-weight: bold;
            text-decoration: none;
            position: relative;
        }

        .signin-box a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0%;
            height: 2px;
            background: white;
            transition: 0.3s;
        }

        .signin-box a:hover::after {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Sign Up</h2>

    <form id="signupForm">

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" required>

        <label>Phone Number</label>
        <input type="text" id="phoneNumber" placeholder="+998901234567" required>

        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit">Sign Up</button>
    </form>

    <div class="message" id="msg"></div>

    <!-- 🔥 SIGN IN LINK -->
    <div class="signin-box">
        <span>Already have an account?</span>
        <a href="/api/v1/sign-in.html">Sign In</a>

    </div>
</div>

<script>
    const BASE = window.location.origin + "/api/v1";
    const form = document.getElementById("signupForm");
    const msg = document.getElementById("msg");

    function setMessage(text, type) {
        msg.innerText = text;
        msg.className = "message " + type;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
            fullName: document.getElementById("fullName").value.trim(),
            phoneNumber: document.getElementById("phoneNumber").value.trim(),
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            setMessage("Signing up...", "info");

            const res = await fetch(BASE + "/auth/sign-up", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const text = await res.text();

            if (res.ok) {
                setMessage("Ro‘yxatdan o‘tildi!", "success");

                setTimeout(() => {
                    window.location.href =
                        "/api/v1/verify.html?username=" + encodeURIComponent(data.username);
                }, 1200);
            } else {
                setMessage(text || "Sign up failed", "error");
            }

        } catch (err) {
            console.error(err);
            setMessage("Backendga ulanib bo‘lmadi", "error");
        }
    });
</script>

</body>
</html>
