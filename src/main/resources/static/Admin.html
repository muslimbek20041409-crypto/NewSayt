<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
            color: #e5e7eb;
            display: flex;
        }

        .sidebar {
            width: 270px;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(148, 163, 184, 0.2);
            padding: 24px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .role {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .menu-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: #cbd5e1;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-weight: 700;
            transition: 0.25s;
        }

        .menu-btn:hover,
        .menu-btn.active {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .logout {
            margin-top: 25px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .main {
            margin-left: 270px;
            width: calc(100% - 270px);
            padding: 28px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 30px;
        }

        .badge {
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            font-weight: 700;
            font-size: 14px;
        }

        .message {
            margin-bottom: 18px;
            min-height: 24px;
            font-weight: 800;
        }

        .message.success {
            color: #86efac;
        }

        .message.error {
            color: #fca5a5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .stat-card span {
            color: #94a3b8;
            font-size: 14px;
        }

        .stat-card h2 {
            margin: 10px 0 0;
            font-size: 30px;
        }

        .section {
            display: none;
            background: rgba(15, 23, 42, 0.76);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.28);
        }

        .section.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-header h2 {
            margin: 0;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.95);
            color: white;
            outline: none;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #60a5fa;
        }

        .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .btn-green {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
        }

        .btn-red {
            background: #ef4444;
            color: white;
        }

        .btn-yellow {
            background: #f59e0b;
            color: #111827;
        }

        .btn-soft {
            background: rgba(148, 163, 184, 0.15);
            color: #e5e7eb;
        }

        .list {
            display: grid;
            gap: 12px;
        }

        .item {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
        }

        .item-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .muted {
            color: #94a3b8;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .question-box {
            background: rgba(2, 6, 23, 0.6);
            border: 1px dashed rgba(148, 163, 184, 0.35);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .question-box h4 {
            margin: 0 0 10px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1000px) {
            body {
                display: block;
            }

            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main {
                margin-left: 0;
                width: 100%;
            }

            .stats,
            .grid-form {
                grid-template-columns: 1fr;
            }

            .item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">Admin Dashboard</div>
    <div class="role">Test platform boshqaruvi</div>

    <button class="menu-btn active" onclick="showSection('dashboard', this)">Dashboard</button>
    <button class="menu-btn" onclick="showSection('tests', this)">Tests</button>
    <button class="menu-btn" onclick="showSection('teachers', this)">Teachers</button>
    <button class="menu-btn" onclick="showSection('students', this)">Students</button>
    <button class="menu-btn" onclick="showSection('admins', this)">Admins</button>

    <button class="menu-btn logout" onclick="logout()">Logout</button>
</aside>

<main class="main">

    <div class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="badge">ADMIN MODE</div>
    </div>

    <div id="message" class="message"></div>

    <div class="stats">
        <div class="stat-card">
            <span>Teachers</span>
            <h2 id="teacherCount">0</h2>
        </div>
        <div class="stat-card">
            <span>Students</span>
            <h2 id="studentCount">0</h2>
        </div>
        <div class="stat-card">
            <span>Tests</span>
            <h2 id="testCount">0</h2>
        </div>
        <div class="stat-card">
            <span>Admins</span>
            <h2 id="adminCount">0</h2>
        </div>
    </div>

    <section id="dashboard" class="section active">
        <div class="section-header">
            <h2>Umumiy boshqaruv</h2>
        </div>
        <p class="muted">
            Bu panel orqali admin teacher, student, admin va testlarni boshqaradi.
        </p>
    </section>

    <section id="tests" class="section">
        <div class="section-header">
            <h2>Testlar boshqaruvi</h2>
            <button class="btn btn-primary" onclick="openCreateTest()">+ Yangi test</button>
        </div>

        <div id="testForm" class="hidden">
            <h3 id="testFormTitle">Yangi test yaratish</h3>

            <div class="grid-form">
                <input id="testTitle" placeholder="Test nomi">
                <select id="testLevel">
                    <option value="EASY">Easy</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HARD">Hard</option>
                </select>
                <select id="testTeacherId">
                    <option value="">Teacher tanlang</option>
                </select>
            </div>

            <textarea id="testDescription" placeholder="Test haqida qisqacha ma'lumot"></textarea>

            <h3>Savollar</h3>
            <div id="questionsContainer"></div>

            <button class="btn btn-soft" onclick="addQuestion()">+ Savol qo‘shish</button>
            <button class="btn btn-green" onclick="saveTest()">Saqlash</button>
            <button class="btn btn-red" onclick="closeTestForm()">Bekor qilish</button>

            <hr style="border-color: rgba(148,163,184,0.2); margin: 22px 0;">
        </div>

        <div id="testsList" class="list"></div>
    </section>

    <section id="teachers" class="section">
        <div class="section-header">
            <h2>Teachers</h2>
            <button class="btn btn-soft" onclick="loadTeachers()">🔄 Refresh</button>
        </div>

        <div class="grid-form">
            <input id="tFullName" placeholder="Full name">
            <input id="tPhone" placeholder="Phone number">
            <input id="tUser" placeholder="Username">
            <input id="tPass" type="password" placeholder="Password">
        </div>

        <button id="createTeacherBtn" class="btn btn-green" onclick="createTeacher()">Create Teacher</button>

        <br><br>
        <div id="teachersList" class="list"></div>
    </section>

    <section id="students" class="section">
        <div class="section-header">
            <h2>Students</h2>
            <button class="btn btn-soft" onclick="loadStudents()">🔄 Refresh</button>
        </div>

        <div id="studentsList" class="list"></div>
    </section>

    <section id="admins" class="section">
        <div class="section-header">
            <h2>Admins</h2>
            <button class="btn btn-soft" onclick="loadAdmins()">🔄 Refresh</button>
        </div>

        <div class="grid-form">
            <input id="aFullName" placeholder="Full name">
            <input id="aUser" placeholder="Username">
            <input id="aPass" type="password" placeholder="Password">
        </div>

        <button id="createAdminBtn" class="btn btn-green" onclick="createAdmin()">Create Admin</button>

        <br><br>
        <div id="adminsList" class="list"></div>
    </section>

</main>

<script>
    const BASE = window.location.origin + "/api/v1";

    let token = cleanToken(localStorage.getItem("token"));
    let teachersCache = [];
    let editingTestId = null;

    if (!token) {
        location.href = "/api/v1/sign-in.html";
    }

    function cleanToken(value) {
        if (!value || value === "null" || value === "undefined") return null;
        return String(value).replace(/^Bearer\s+/i, "").trim();
    }

    function headers() {
        token = cleanToken(localStorage.getItem("token"));

        return {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        };
    }

    function showMessage(text, type = "success") {
        const box = document.getElementById("message");
        box.innerText = (type === "success" ? "✓ " : "⚠ ") + text;
        box.className = "message " + type;

        clearTimeout(showMessage.timer);
        showMessage.timer = setTimeout(() => {
            box.innerText = "";
            box.className = "message";
        }, 5000);
    }

    async function api(path, options = {}) {
        const res = await fetch(BASE + path, {
            ...options,
            headers: {
                ...headers(),
                ...(options.headers || {})
            }
        });

        const text = await res.text();
        let data = null;

        try {
            data = text ? JSON.parse(text) : null;
        } catch {
            data = text;
        }

        if (res.status === 401 || res.status === 403) {
            console.error("AUTH ERROR:", res.status, data);
            showMessage("Admin token yoki role xato. Qayta login qiling.", "error");
            throw new Error("AUTH ERROR " + res.status);
        }

        if (!res.ok) {
            console.error("API ERROR:", path, res.status, data);
            const msg =
                (typeof data === "object" && data?.message) ||
                (typeof data === "string" && data) ||
                "Server xatosi: " + res.status;
            showMessage(msg, "error");
            throw new Error(msg);
        }

        return data;
    }

    function getArray(data) {
        if (!data) return [];
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.content)) return data.content;
        if (Array.isArray(data.data)) return data.data;
        return [];
    }

    function escapeHtml(value = "") {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function showSection(id, btn) {
        document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
        document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("active"));

        document.getElementById(id).classList.add("active");
        if (btn) btn.classList.add("active");

        document.getElementById("pageTitle").innerText =
            id.charAt(0).toUpperCase() + id.slice(1);

        if (id === "teachers") loadTeachers();
        if (id === "students") loadStudents();
        if (id === "admins") loadAdmins();
        if (id === "tests") loadTests();
    }

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        location.href = "/api/v1/sign-in.html";
    }

    // ================= TEACHERS =================

    async function loadTeachers() {
        const list = document.getElementById("teachersList");
        list.innerHTML = `<p class="muted">Teacherlar yuklanmoqda...</p>`;

        try {
            const data = getArray(await api("/teacher"));

            teachersCache = data;
            document.getElementById("teacherCount").innerText = data.length;

            const select = document.getElementById("testTeacherId");
            select.innerHTML = `<option value="">Teacher tanlang</option>`;

            data.forEach(t => {
                select.innerHTML += `
                    <option value="${escapeHtml(t.id)}">
                        ${escapeHtml(t.fullName || t.firstName || t.username || "Teacher")}
                    </option>
                `;
            });

            list.innerHTML = "";

            if (data.length === 0) {
                list.innerHTML = `<p class="muted">Teacher topilmadi. Yangi teacher yarating.</p>`;
                return;
            }

            data.forEach(t => {
                list.innerHTML += `
                    <div class="item">
                        <div>
                            <div class="item-title">${escapeHtml(t.fullName || t.firstName || t.username || "-")}</div>
                            <div class="muted">Username: ${escapeHtml(t.username || "-")}</div>
                            <div class="muted">Phone: ${escapeHtml(t.phoneNumber || "-")}</div>
                            <div class="muted">ID: ${escapeHtml(t.id || "-")}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-red" onclick="deleteTeacher('${escapeHtml(t.id)}')">Delete</button>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            list.innerHTML = `<p class="muted">Teacherlarni yuklab bo‘lmadi: ${escapeHtml(e.message)}</p>`;
        }
    }

    async function createTeacher() {
        const btn = document.getElementById("createTeacherBtn");

        const data = {
            fullName: document.getElementById("tFullName").value.trim(),
            phoneNumber: document.getElementById("tPhone").value.trim(),
            username: document.getElementById("tUser").value.trim(),
            password: document.getElementById("tPass").value
        };

        if (!data.fullName || !data.username || !data.password) {
            showMessage("Full name, username va password majburiy.", "error");
            return;
        }

        try {
            btn.disabled = true;
            btn.innerText = "Creating...";

            await api("/teacher", {
                method: "POST",
                body: JSON.stringify(data)
            });

            document.getElementById("tFullName").value = "";
            document.getElementById("tPhone").value = "";
            document.getElementById("tUser").value = "";
            document.getElementById("tPass").value = "";

            showMessage("Teacher yaratildi.");
            await loadTeachers();

        } catch (e) {
            showMessage("Teacher yaratilmadi: " + e.message, "error");
        } finally {
            btn.disabled = false;
            btn.innerText = "Create Teacher";
        }
    }

    async function deleteTeacher(id) {
        if (!id) return;
        if (!confirm("Teacher o‘chirilsinmi?")) return;

        try {
            await api("/teacher/" + encodeURIComponent(id), {
                method: "DELETE"
            });

            showMessage("Teacher o‘chirildi.");
            await loadTeachers();
            await loadTests();

        } catch (e) {
            showMessage("Teacher o‘chirilmadi: " + e.message, "error");
        }
    }

    // ================= STUDENTS =================

    async function loadStudents() {
        const list = document.getElementById("studentsList");
        list.innerHTML = `<p class="muted">Studentlar yuklanmoqda...</p>`;

        try {
            const data = getArray(await api("/students"));
            document.getElementById("studentCount").innerText = data.length;

            list.innerHTML = "";

            if (data.length === 0) {
                list.innerHTML = `<p class="muted">Student topilmadi.</p>`;
                return;
            }

            data.forEach(s => {
                list.innerHTML += `
                    <div class="item">
                        <div>
                            <div class="item-title">${escapeHtml(s.fullName || s.firstName || s.username || "-")}</div>
                            <div class="muted">Username: ${escapeHtml(s.username || "-")}</div>
                            <div class="muted">Phone: ${escapeHtml(s.phoneNumber || "-")}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-red" onclick="deleteStudent('${escapeHtml(s.id)}')">Delete</button>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            list.innerHTML = `<p class="muted">Studentlarni yuklab bo‘lmadi: ${escapeHtml(e.message)}</p>`;
        }
    }

    async function deleteStudent(id) {
        if (!confirm("Student o‘chirilsinmi?")) return;

        try {
            await api("/students/" + encodeURIComponent(id), {
                method: "DELETE"
            });

            showMessage("Student o‘chirildi.");
            await loadStudents();

        } catch (e) {
            showMessage("Student o‘chirilmadi: " + e.message, "error");
        }
    }

    // ================= ADMINS =================

    async function loadAdmins() {
        const list = document.getElementById("adminsList");
        list.innerHTML = `<p class="muted">Adminlar yuklanmoqda...</p>`;

        try {
            const data = getArray(await api("/admin"));
            document.getElementById("adminCount").innerText = data.length;

            list.innerHTML = "";

            if (data.length === 0) {
                list.innerHTML = `<p class="muted">Admin topilmadi.</p>`;
                return;
            }

            data.forEach(a => {
                list.innerHTML += `
                    <div class="item">
                        <div>
                            <div class="item-title">${escapeHtml(a.fullName || a.username || "-")}</div>
                            <div class="muted">Username: ${escapeHtml(a.username || "-")}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-red" onclick="deleteAdmin('${escapeHtml(a.id)}')">Delete</button>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            list.innerHTML = `<p class="muted">Adminlarni yuklab bo‘lmadi: ${escapeHtml(e.message)}</p>`;
        }
    }

    async function createAdmin() {
        const btn = document.getElementById("createAdminBtn");

        const data = {
            fullName: document.getElementById("aFullName").value.trim(),
            username: document.getElementById("aUser").value.trim(),
            password: document.getElementById("aPass").value
        };

        if (!data.fullName || !data.username || !data.password) {
            showMessage("Full name, username va password majburiy.", "error");
            return;
        }

        try {
            btn.disabled = true;
            btn.innerText = "Creating...";

            await api("/admin", {
                method: "POST",
                body: JSON.stringify(data)
            });

            document.getElementById("aFullName").value = "";
            document.getElementById("aUser").value = "";
            document.getElementById("aPass").value = "";

            showMessage("Admin yaratildi.");
            await loadAdmins();

        } catch (e) {
            showMessage("Admin yaratilmadi: " + e.message, "error");
        } finally {
            btn.disabled = false;
            btn.innerText = "Create Admin";
        }
    }

    async function deleteAdmin(id) {
        if (!confirm("Admin o‘chirilsinmi?")) return;

        try {
            await api("/admin/" + encodeURIComponent(id), {
                method: "DELETE"
            });

            showMessage("Admin o‘chirildi.");
            await loadAdmins();

        } catch (e) {
            showMessage("Admin o‘chirilmadi: " + e.message, "error");
        }
    }

    // ================= TESTS =================

    function openCreateTest() {
        editingTestId = null;
        document.getElementById("testFormTitle").innerText = "Yangi test yaratish";
        document.getElementById("testForm").classList.remove("hidden");

        document.getElementById("testTitle").value = "";
        document.getElementById("testDescription").value = "";
        document.getElementById("testLevel").value = "EASY";
        document.getElementById("testTeacherId").value = "";
        document.getElementById("questionsContainer").innerHTML = "";

        addQuestion();
    }

    function closeTestForm() {
        document.getElementById("testForm").classList.add("hidden");
        editingTestId = null;
    }

    function addQuestion(q = {}) {
        const box = document.createElement("div");
        box.className = "question-box";

        box.innerHTML = `
            <h4>Savol</h4>

            <textarea class="qText" placeholder="Savol matni">${escapeHtml(q.questionText || "")}</textarea>

            <div class="grid-form">
                <select class="qType">
                    <option value="SINGLE_CHOICE" ${q.questionType === "SINGLE_CHOICE" ? "selected" : ""}>Single choice</option>
                    <option value="MULTIPLE_CHOICE" ${q.questionType === "MULTIPLE_CHOICE" ? "selected" : ""}>Multiple choice</option>
                    <option value="TRUE_FALSE" ${q.questionType === "TRUE_FALSE" ? "selected" : ""}>True / False</option>
                    <option value="MATCHING" ${q.questionType === "MATCHING" ? "selected" : ""}>Matching</option>
                </select>

                <input class="qPoints" type="number" min="1" placeholder="Ball" value="${q.points || 1}">

                <button type="button" class="btn btn-red" onclick="this.closest('.question-box').remove()">Savolni o‘chirish</button>
            </div>

            <input class="qAllAnswers" placeholder="Variantlar: Paris,London,Berlin" value="${Array.isArray(q.allAnswers) ? escapeHtml(q.allAnswers.join(",")) : ""}">
            <input class="qTrueAnswers" placeholder="To‘g‘ri javob: Paris yoki Paris,Berlin" value="${Array.isArray(q.trueAnswers) ? escapeHtml(q.trueAnswers.join(",")) : ""}">
            <input class="qTrueFalse" placeholder="True/False javob: TRUE yoki FALSE" value="${escapeHtml(q.trueFalseAnswer || "")}">
            <input class="qLeftItems" placeholder="Matching chap: Uzbekistan,France" value="${Array.isArray(q.leftItems) ? escapeHtml(q.leftItems.join(",")) : ""}">
            <input class="qRightItems" placeholder="Matching o‘ng: Tashkent,Paris" value="${Array.isArray(q.rightItems) ? escapeHtml(q.rightItems.join(",")) : ""}">
            <input class="qCorrectPairs" placeholder="Juftliklar: Uzbekistan=Tashkent,France=Paris" value="${Array.isArray(q.correctPairs) ? escapeHtml(q.correctPairs.join(",")) : ""}">
        `;

        document.getElementById("questionsContainer").appendChild(box);
    }

    function splitValue(value) {
        if (!value || !value.trim()) return [];
        return value.split(",").map(v => v.trim()).filter(v => v.length > 0);
    }

    function collectQuestions() {
        const boxes = document.querySelectorAll(".question-box");

        return Array.from(boxes).map(box => {
            return {
                questionText: box.querySelector(".qText").value.trim(),
                questionType: box.querySelector(".qType").value,
                points: Number(box.querySelector(".qPoints").value || 1),
                allAnswers: splitValue(box.querySelector(".qAllAnswers").value),
                trueAnswers: splitValue(box.querySelector(".qTrueAnswers").value),
                trueFalseAnswer: box.querySelector(".qTrueFalse").value.trim(),
                leftItems: splitValue(box.querySelector(".qLeftItems").value),
                rightItems: splitValue(box.querySelector(".qRightItems").value),
                correctPairs: splitValue(box.querySelector(".qCorrectPairs").value)
            };
        });
    }

    async function saveTest() {
        const data = {
            title: document.getElementById("testTitle").value.trim(),
            description: document.getElementById("testDescription").value.trim(),
            questionLevel: document.getElementById("testLevel").value,
            teacherId: document.getElementById("testTeacherId").value || null,
            questions: collectQuestions()
        };

        if (!data.title) {
            showMessage("Test nomini kiriting.", "error");
            return;
        }

        if (data.questions.length === 0) {
            showMessage("Kamida bitta savol qo‘shing.", "error");
            return;
        }

        const path = editingTestId
            ? "/test/" + encodeURIComponent(editingTestId)
            : "/test";

        const method = editingTestId ? "PUT" : "POST";

        try {
            await api(path, {
                method,
                body: JSON.stringify(data)
            });

            closeTestForm();
            showMessage("Test saqlandi.");
            await loadTests();

        } catch (e) {
            showMessage("Test saqlanmadi: " + e.message, "error");
        }
    }

    async function loadTests() {
        const list = document.getElementById("testsList");
        list.innerHTML = `<p class="muted">Testlar yuklanmoqda...</p>`;

        try {
            const tests = getArray(await api("/test"));
            document.getElementById("testCount").innerText = tests.length;

            list.innerHTML = "";

            if (tests.length === 0) {
                list.innerHTML = `<p class="muted">Test topilmadi.</p>`;
                return;
            }

            tests.forEach(t => {
                list.innerHTML += `
                    <div class="item">
                        <div>
                            <div class="item-title">${escapeHtml(t.title || t.questionText || "Nomsiz test")}</div>
                            <div class="muted">Teacher: ${escapeHtml(t.teacherFullName || t.professorFullName || t.teacherName || "-")}</div>
                            <div class="muted">Savollar: ${Array.isArray(t.questions) ? t.questions.length : 0}</div>
                            <div class="muted">Level: ${escapeHtml(t.questionLevel || t.level || "-")}</div>
                        </div>

                        <div class="actions">
                            <button class="btn btn-yellow" onclick='editTestFromId("${escapeHtml(t.id)}")'>Edit</button>
                            <button class="btn btn-red" onclick="deleteTest('${escapeHtml(t.id)}')">Delete</button>
                        </div>
                    </div>
                `;
            });

        } catch (e) {
            list.innerHTML = `<p class="muted">Testlarni yuklab bo‘lmadi: ${escapeHtml(e.message)}</p>`;
        }
    }

    async function editTestFromId(id) {
        try {
            const t = await api("/test/" + encodeURIComponent(id));
            editTest(t);
        } catch (e) {
            showMessage("Testni ochib bo‘lmadi: " + e.message, "error");
        }
    }

    function editTest(t) {
        editingTestId = t.id;

        document.getElementById("testFormTitle").innerText = "Testni tahrirlash";
        document.getElementById("testForm").classList.remove("hidden");

        document.getElementById("testTitle").value = t.title || "";
        document.getElementById("testDescription").value = t.description || "";
        document.getElementById("testLevel").value = t.questionLevel || t.level || "EASY";
        document.getElementById("testTeacherId").value = t.teacherId || t.professorId || "";

        document.getElementById("questionsContainer").innerHTML = "";

        if (Array.isArray(t.questions) && t.questions.length > 0) {
            t.questions.forEach(q => addQuestion(q));
        } else {
            addQuestion(t);
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteTest(id) {
        if (!confirm("Test o‘chirilsinmi?")) return;

        try {
            await api("/test/" + encodeURIComponent(id), {
                method: "DELETE"
            });

            showMessage("Test o‘chirildi.");
            await loadTests();

        } catch (e) {
            showMessage("Test o‘chirilmadi: " + e.message, "error");
        }
    }

    async function init() {
        await Promise.allSettled([
            loadTeachers(),
            loadStudents(),
            loadAdmins(),
            loadTests()
        ]);
    }

    init();
</script>

</body>
</html>
