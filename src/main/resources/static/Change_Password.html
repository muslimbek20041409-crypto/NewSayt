<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1d4ed8, #0f766e);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 400px;
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: white;
            color: #1d4ed8;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 10px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Change Password</h2>

    <!-- STEP 1 -->
    <form id="phoneForm">
        <input id="phone" placeholder="+998901234567" required>
        <button>Send Code</button>
    </form>

    <!-- STEP 2 -->
    <form id="codeForm" class="hidden">
        <input id="code" placeholder="Enter code" required>
        <button>Verify Code</button>
    </form>

    <!-- STEP 3 -->
    <form id="passForm" class="hidden">
        <input id="newPass" type="password" placeholder="New password" required>
        <input id="confirmPass" type="password" placeholder="Repeat password" required>
        <button>Change Password</button>
    </form>

    <div class="message" id="msg"></div>
</div>

<script>
    const BASE = window.location.origin + "/api/v1";

    let phoneNumber = "";

    // STEP 1
    phoneForm.onsubmit = async (e) => {
        e.preventDefault();

        phoneNumber = phone.value;

        const res = await fetch(BASE + "/auth/forgot-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({phoneNumber})
        });

        if (res.ok) {
            msg.innerText = "Code sent to Telegram";
            phoneForm.classList.add("hidden");
            codeForm.classList.remove("hidden");
        } else {
            msg.innerText = "Error sending code";
        }
    };

    // STEP 2
    codeForm.onsubmit = async (e) => {
        e.preventDefault();

        const res = await fetch(BASE + "/auth/verify-reset-code", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                phoneNumber,
                code: code.value
            })
        });

        if (res.ok) {
            msg.innerText = "Code verified";
            codeForm.classList.add("hidden");
            passForm.classList.remove("hidden");
        } else {
            msg.innerText = "Wrong code";
        }
    };

    // STEP 3
    passForm.onsubmit = async (e) => {
        e.preventDefault();

        if (newPass.value !== confirmPass.value) {
            msg.innerText = "Passwords do not match!";
            return;
        }

        const res = await fetch(BASE + "/auth/reset-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                phoneNumber,
                newPassword: newPass.value
            })
        });

        if (res.ok) {
            msg.innerText = "Password changed!";
            setTimeout(() => {
                window.location.href = "/api/v1/auth.html";
            }, 1000);
        } else {
            msg.innerText = "Error";
        }
    };
</script>

</body>
</html>
